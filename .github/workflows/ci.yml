name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "screenshoot/**"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_PROCESS_TIMEOUT: "600"

jobs:
  quality:
    name: Quality - PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: "8.5" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, tokenizer, xml, fileinfo
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=1, log_errors=0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify composer.lock is committed
        shell: bash
        run: |
          if [ ! -f composer.lock ]; then
            echo "::error::composer.lock is not committed"
            exit 1
          fi

      - name: Verify build outputs are gitignored
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for path in vendor/ dist/ src/build-info.php .php-cs-fixer.cache .phpstan.cache/ node_modules/; do
            if ! git check-ignore -q "$path"; then
              echo "::error::$path is not gitignored"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then exit 1; fi

      - name: Validate composer.json
        shell: bash
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        shell: bash
        run: make install

      - name: Install Node dependencies
        shell: bash
        run: npm ci

      - name: Verify style.css is up-to-date
        shell: bash
        run: |
          set -euo pipefail
          # Simpan versi committed untuk diff nanti
          cp src/assets/css/style.css /tmp/style.css.committed
          npm run css > /dev/null
          if ! cmp -s /tmp/style.css.committed src/assets/css/style.css; then
            echo "::error::style.css is out of date. Run 'npm run css' locally and commit."
            diff /tmp/style.css.committed src/assets/css/style.css | head -40
            exit 1
          fi
          echo "style.css is up-to-date"

      - name: Security audit
        shell: bash
        run: composer audit --no-interaction

      - name: Format check
        shell: bash
        run: make fmt-check

      - name: Lint
        shell: bash
        run: make lint

      - name: Static analysis
        shell: bash
        run: make stan

      - name: Build distribution
        shell: bash
        run: make dist

      - name: Verify dist PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              failed=1
            fi
          done < <(find dist -name '*.php' -print0)
          if [ "${failed}" -ne 0 ]; then
            echo "::error::dist contains PHP files with syntax errors"
            exit 1
          fi

      - name: Verify no stray CSS sources in dist
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/assets/css/tailwind.css dist/assets/css/theme.css dist/assets/css/base.css; do
            if [ -f "$f" ]; then
              echo "::error::Unexpected CSS source in dist: $f"
              exit 1
            fi
          done
          echo "dist contains only compiled CSS"

      - name: Verify working tree is clean
        shell: bash
        run: |
          set -euo pipefail
          dirty=$(git status --porcelain --untracked-files=no || true)
          if [ -n "${dirty}" ]; then
            echo "::error::Tracked files were modified during build"
            echo "${dirty}"
            git diff
            exit 1
          fi
          echo "Working tree is clean"

  smoke:
    name: Smoke - HTTP routes
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, openssl, tokenizer
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=1, log_errors=0

      - name: Probe routes
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8000 -t src > /tmp/php-server.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/ 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          routes=(
            "index.php?page=home"
            "index.php?page=auth/login"
            "index.php?page=auth/register-user"
            "index.php?page=auth/register-agent"
            "index.php?page=customer/dashboard"
            "index.php?page=customer/products"
            "index.php?page=agent/dashboard"
            "index.php?page=admin/dashboard"
          )

          failed=0
          for route in "${routes[@]}"; do
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' "http://127.0.0.1:8000/${route}")
            if [ "${code}" != "200" ]; then
              echo "::error::${route} returned ${code}"
              head -30 /tmp/body.html
              failed=1
            fi
            if grep -qE '(Fatal error|Parse error|Warning:|Notice:|Deprecated:)' /tmp/body.html; then
              echo "::error::${route} contains PHP error output"
              grep -E '(Fatal error|Parse error|Warning:|Notice:|Deprecated:)' /tmp/body.html | head -20
              failed=1
            fi
            if grep -q '98\.css' /tmp/body.html; then
              echo "::error::${route} still references 98.css"
              failed=1
            fi
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/index.php?page=does-not-exist")
          if [ "${code}" != "404" ]; then
            echo "::error::Unknown route should return 404, got ${code}"
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            echo "--- server log ---"
            cat /tmp/php-server.log
            exit 1
          fi

          echo "All routes returned expected status with no PHP errors"
