name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'screenshoot/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'
  COMPOSER_PROCESS_TIMEOUT: '600'

jobs:
  quality:
    name: Quality - PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '8.5' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, tokenizer, xml, fileinfo
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=1, log_errors=0

      - name: Verify composer.lock is committed
        shell: bash
        run: |
          if [ ! -f composer.lock ]; then
            echo "::error::composer.lock is not committed"
            exit 1
          fi

      - name: Verify build outputs are gitignored
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for path in vendor dist src/build-info.php .php-cs-fixer.cache .phpstan.cache; do
            if ! git check-ignore -q "$path"; then
              echo "::error::$path is not gitignored"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then exit 1; fi

      - name: Validate composer.json
        shell: bash
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        shell: bash
        run: make install

      - name: Security audit
        shell: bash
        run: composer audit --no-interaction

      - name: Format check
        shell: bash
        run: make fmt-check

      - name: Lint
        shell: bash
        run: make lint

      - name: Static analysis
        shell: bash
        run: make stan

      - name: Build distribution
        shell: bash
        run: make dist

      - name: Verify dist PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              failed=1
            fi
          done < <(find dist -name '*.php' -print0)
          if [ "${failed}" -ne 0 ]; then
            echo "::error::dist contains PHP files with syntax errors"
            exit 1
          fi

      - name: Verify vendored assets are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d src/assets/vendor ]; then
            echo "No vendored assets"
            exit 0
          fi
          failed=0
          while IFS= read -r -d '' src_file; do
            rel="${src_file#src/}"
            dst_file="dist/${rel}"
            if [ ! -f "${dst_file}" ]; then
              echo "::error::Missing in dist: ${rel}"
              failed=1
              continue
            fi
            if ! cmp -s "${src_file}" "${dst_file}"; then
              echo "::error::Byte mismatch: ${rel}"
              failed=1
            fi
          done < <(find src/assets/vendor -type f -print0)
          if [ "${failed}" -ne 0 ]; then exit 1; fi
          echo "All vendored assets are byte-identical"

      - name: Verify SRI hash matches vendored CSS
        shell: bash
        run: |
          set -euo pipefail
          integrity=$(grep -o 'integrity="[^"]*"' src/components/head.php | head -n1 | cut -d'"' -f2 || true)
          if [ -z "${integrity}" ]; then
            echo "::warning::No integrity attribute in head.php"
            exit 0
          fi
          algorithm="sha384"
          hash="${integrity}"
          if [[ "${integrity}" =~ ^(sha256|sha384|sha512)-(.+)$ ]]; then
            algorithm="${BASH_REMATCH[1]}"
            hash="${BASH_REMATCH[2]}"
          fi
          actual=$(openssl dgst -"${algorithm}" -binary src/assets/vendor/98.css | openssl base64 -A)
          if [ "${hash}" != "${actual}" ]; then
            echo "::error::SRI hash mismatch for 98.css"
            echo "  declared: ${algorithm}-${hash}"
            echo "  actual  : ${algorithm}-${actual}"
            exit 1
          fi
          echo "SRI hash verified (${algorithm})"

      - name: Verify working tree is clean
        shell: bash
        run: |
          set -euo pipefail
          dirty=$(git status --porcelain --untracked-files=no || true)
          if [ -n "${dirty}" ]; then
            echo "::error::Tracked files were modified during build"
            echo "${dirty}"
            git diff
            exit 1
          fi
          echo "Working tree is clean"

  windows-paths:
    name: Windows path handling (informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, openssl, tokenizer
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build distribution
        run: php bin/build-dist.php

      - name: Verify vendored CSS is byte-identical
        shell: pwsh
        run: |
          $src = Get-FileHash src/assets/vendor/98.css -Algorithm SHA256
          $dst = Get-FileHash dist/assets/vendor/98.css -Algorithm SHA256
          if ($src.Hash -ne $dst.Hash) {
            Write-Error "Vendored 98.css was modified by the build on Windows"
            exit 1
          }
          Write-Host "Vendored CSS is byte-identical on Windows"

  smoke:
    name: Smoke - HTTP routes
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, openssl, tokenizer
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=1, log_errors=0

      - name: Probe routes
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8000 -t src > /tmp/php-server.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/ 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          routes=(
            "index.php?page=home"
            "index.php?page=auth/login"
            "index.php?page=auth/register-user"
            "index.php?page=auth/register-agent"
            "index.php?page=customer/dashboard"
            "index.php?page=customer/products"
            "index.php?page=agent/dashboard"
            "index.php?page=admin/dashboard"
          )

          failed=0
          for route in "${routes[@]}"; do
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' "http://127.0.0.1:8000/${route}")
            if [ "${code}" != "200" ]; then
              echo "::error::${route} returned ${code}"
              head -30 /tmp/body.html
              failed=1
            fi
            if grep -qE '(Fatal error|Parse error|Warning:|Notice:|Deprecated:)' /tmp/body.html; then
              echo "::error::${route} contains PHP error output"
              grep -E '(Fatal error|Parse error|Warning:|Notice:|Deprecated:)' /tmp/body.html | head -20
              failed=1
            fi
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/index.php?page=does-not-exist")
          if [ "${code}" != "404" ]; then
            echo "::error::Unknown route should return 404, got ${code}"
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            echo "--- server log ---"
            cat /tmp/php-server.log
            exit 1
          fi

          echo "All routes returned expected status with no PHP errors"
